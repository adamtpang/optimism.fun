# repos.yaml v0 — see github.com/adamtpang/repo-protocol
repo: optimism.fun
is: Ranks humanity's biggest unsolved problems from live public data.
url: https://optimism.fun
cluster: legibility-engines
ranks: problems

provides:
  - id: ai-ranking
    what: Claude scores and ranks entities from live public sources
    at: src/lib/rankings.ts
  - id: data-sources
    what: OWID, World Bank, WHO, OpenFDA fetch+cache adapters
    at: src/lib/sources

stack: [next, neon, anthropic, posthog]

kin:
  - repo: pokedex.life
    why: idea-level kin, not shared code — both rank entities by weighted axes plus hard-constraint filters (see ECOSYSTEM.md); pokedex.life ranks people, this repo ranks problems
  - repo: portal.voyage
    why: idea-level kin, not shared code — both rank entities by weighted axes plus hard-constraint filters (see ECOSYSTEM.md); portal.voyage ranks places, this repo ranks problems
  - repo: ness.city
    why: consumes the problem ranking as civic bounties
  - repo: moneymeta.fun
    why: same legibility-engines ranking pattern (live public data -> S-D-style rank) applied to money instead of problems, same family as pokedex.life (people) and portal.voyage (places); moneymeta.fun ranks income paths from BLS data the way this repo ranks problems from OWID/World Bank/WHO/OpenFDA.
  - repo: skill.supply
    why: same legibility-engines pattern, same manifest convention (this repo declares "ranks: problems", skill.supply declares "ranks: candidates"). skill.supply's /skills Skill Market Cap ranks live job-board demand hourly, a real live-data ranking engine same as this one, just applied to talent instead of problems.
  - repo: themain.quest
    why: this repo ranks which problems are worth a lifetime of work at civilizational scale, the macro choose-the-quest layer; themain.quest holds whatever quest Adam actually commits to as the one binding goal and runs it day to day, the micro execute-the-quest layer. Same quest-selection thesis, different scale.

canon: ECOSYSTEM.md
