# repos.yaml v0 — see github.com/adamtpang/repo-protocol
repo: optimism.fun
is: Ranks humanity's biggest unsolved problems from live public data.
url: https://optimism.fun
cluster: legibility-engines
ranks: problems

provides:
  - id: ai-ranking
    what: Claude scores and ranks entities from live public sources
    at: src/lib/rankings.ts
  - id: data-sources
    what: OWID, World Bank, WHO, OpenFDA fetch+cache adapters
    at: src/lib/sources

stack: [next, neon, anthropic, posthog]

kin:
  - repo: pokedex.life
    why: same ranking engine, applied to people instead of problems
  - repo: portal.voyage
    why: same ranking engine, applied to places instead of problems
  - repo: ness.city
    why: consumes the problem ranking as civic bounties

canon: ECOSYSTEM.md
