# repos.yaml v0 — see github.com/adamtpang/repo-protocol
repo: optimism.fun
is: Ranks humanity's biggest unsolved problems from live public data.
url: https://optimism.fun
cluster: legibility-engines
ranks: problems

provides:
  - id: ai-ranking
    what: Claude scores and ranks entities from live public sources
    at: src/lib/rankings.ts
  - id: data-sources
    what: OWID, World Bank, WHO, OpenFDA fetch+cache adapters
    at: src/lib/sources

stack: [next, neon, anthropic, posthog]

kin:
  - repo: pokedex.life
    why: idea-level kin, not shared code — both rank entities by weighted axes plus hard-constraint filters (see ECOSYSTEM.md); pokedex.life ranks people, this repo ranks problems
  - repo: portal.voyage
    why: idea-level kin, not shared code — both rank entities by weighted axes plus hard-constraint filters (see ECOSYSTEM.md); portal.voyage ranks places, this repo ranks problems
  - repo: ness.city
    why: consumes the problem ranking as civic bounties
  - repo: moneymeta.fun
    why: same legibility-engines ranking pattern (live public data -> S-D-style rank) applied to money instead of problems, same family as pokedex.life (people) and portal.voyage (places); moneymeta.fun ranks income paths from BLS data the way this repo ranks problems from OWID/World Bank/WHO/OpenFDA.
  - repo: skill.supply
    why: same legibility-engines pattern, same manifest convention (this repo declares "ranks: problems", skill.supply declares "ranks: candidates"). skill.supply's /skills Skill Market Cap ranks live job-board demand hourly, a real live-data ranking engine same as this one, just applied to talent instead of problems. Added 2026-08-22: skill.supply is also the JOIN half of this repo's start-or-join starter packs. Where this repo names the S-tier companies worth joining (Helion, Commonwealth Fusion, Fervo and the rest of the $1T-ceiling set), skill.supply's career agent (lib/agent.ts, lib/candidate.ts, lib/application.ts) is what actually packages a person for those specific roles. This repo supplies the target list; skill.supply runs the placement.
  - repo: summon.company
    why: the START half of this repo's start-or-join starter packs. optimism.fun decides WHICH company is worth founding (the ranked quest, its in-limit prize, its sourced crowding, its starter pack); summon.company is the operating layer that actually runs a company once founded (diagnosis, deliverables, the weekly cadence). Problem-selection paired with company-operation. Note 2026-08-22: summon.company's own repos.yaml `is:` line still describes the older YouTube-corpus identity and contradicts its CLAUDE.md, which describes the company-operating service this edge refers to.
  - repo: themain.quest
    why: this repo ranks which problems are worth a lifetime of work at civilizational scale, the macro choose-the-quest layer; themain.quest holds whatever quest Adam actually commits to as the one binding goal and runs it day to day, the micro execute-the-quest layer. Same quest-selection thesis, different scale. In the who/what/where life map themain.quest hubs (Naval Ravikant's three big decisions), this repo is one of the two WHAT engines, alongside skill.supply.
  - repo: megawatt.fun
    why: this repo's renewable-energy category (src/lib/signals/categories.ts) ranks the energy-abundance problem civilizationally; megawatt.fun is a concrete engineering artifact against one slice of that same problem, grid-battery dispatch economics on real ERCOT prices, macro problem-ranking paired with a micro proof-of-work build.
  - repo: adampang.com
    why: adampang.com is the real source of who Adam is (named loves, archetype, proof-of-work history); this repo's founder-fit interview and archetype matching should read from it directly instead of re-deriving Adam's profile ad hoc per session. See HANDOFF_FIT_AND_CROWDING_2026-08-18.md.
  - repo: Aether
    why: hub-level handoff, 2026-08-18 — a fleet-wide tier list scored all 53 Aether businesses against this repo's own scorecard plus a new personal-fittedness dimension, then used this repo's quest-crowding.ts to find open problems. Found the crowding data undercounts real activity (company-only search misses philanthropic/academic infra). Full situation in HANDOFF_FIT_AND_CROWDING_2026-08-18.md.

canon: ECOSYSTEM.md
